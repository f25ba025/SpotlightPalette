name: Send 5S Cleaning Reminder

on:
  schedule:
    # 毎週月曜日〜金曜日の 07:45 (UTC) に実行する場合
    # ※ 日本時間(JST)の 16:45 になります。
    # 日本時間の朝 08:45 に実行したい場合は UTC 23:45 (前日) に設定します。
    # 例: 日本時間 平日 8:45 に実行 (UTC 23:45 / 日〜木曜に発火)
    #- cron: '45 23 * * 0-4'
     - cron: '*/5 * * * *'
  # 管理者が手動でもテスト実行できるようにする設定
  workflow_dispatch:

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        env:
          FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json")
          
          echo "Response status code: $response"
          if [ "$response" -eq 200 ]; then
            echo "Successfully sent reminder!"
          else
            echo "Failed to send reminder. Status: $response"
            exit 1
          fi
